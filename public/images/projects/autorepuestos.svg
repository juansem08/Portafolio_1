    <rect width="600" height="56" rx="22" fill="#1E293B"/>
    <rect y="34" width="600" height="22" fill="#1E293B"/>
    <circle cx="34" cy="28" r="8" fill="#F87171"/>
    <circle cx="60" cy="28" r="8" fill="#FBBF24"/>
    <circle cx="86" cy="28" r="8" fill="#34D399"/>
    <rect x="130" y="16" width="340" height="24" rx="12" fill="#0F172A"/>

