    <rect x="-18" y="-10" width="200" height="36" rx="18" fill="url(#orange)"/>
    <path d="M-60 8a52 52 0 1 0 52 -52l-6 34l-28 6l-18 -18z" fill="url(#orange)" transform="translate(-20 0)"/>
