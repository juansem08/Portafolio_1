    <circle r="62"/>
    <g stroke-linecap="round">
      <path d="M0 -205V-170M0 170V205M-205 0H-170M170 0H205M-145 -145L-120 -120M120 120L145 145M-145 145L-120 120M120 -120L145 -145"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="96" y="150" width="330" height="48" rx="24" fill="#F97316" fill-opacity="0.14" stroke="#F97316" stroke-opacity="0.5"/>
    <circle cx="124" cy="174" r="7" fill="#F97316"/>
    <text x="144" y="182" font-size="22" font-weight="700" fill="#FDBA74" letter-spacing="2">TALLER AUTOMOTRIZ</text>

    <text x="92" y="318" font-size="104" font-weight="900" fill="#FFFFFF" letter-spacing="-3">Auto</text>
    <text x="92" y="420" font-size="104" font-weight="900" fill="url(#orange)" letter-spacing="-3">Repuestos</text>
    <text x="96" y="486" font-size="34" font-weight="600" fill="#CBD5E1">Calibración y Reparación</text>
    <text x="96" y="540" font-size="26" fill="#94A3B8">Catálogo de repuestos y agendamiento de citas</text>

    <g font-size="22" font-weight="700">
