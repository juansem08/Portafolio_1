      <text x="181" y="634" text-anchor="middle" fill="#E2E8F0">Catálogo</text>
      <rect x="282" y="600" width="150" height="52" rx="12" fill="#1E293B" stroke="#334155"/>
      <text x="357" y="634" text-anchor="middle" fill="#E2E8F0">Citas</text>
      <rect x="448" y="600" width="190" height="52" rx="12" fill="#14532D" stroke="#22C55E" stroke-opacity="0.6"/>
      <text x="543" y="634" text-anchor="middle" fill="#86EFAC">WhatsApp</text>
    </g>
  </g>

  <!-- Maqueta del sitio -->
