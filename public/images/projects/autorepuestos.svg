        <rect x="14" y="14" width="140" height="96" rx="10" fill="#273449"/>
        <path d="M60 40h48v44H60z M72 30h8v10h-8z M88 30h8v10h-8z" fill="none" stroke="#F97316" stroke-width="7"/>
        <rect x="14" y="126" width="100" height="12" rx="6" fill="#64748B"/>
        <rect x="14" y="146" width="90" height="12" rx="6" fill="#475569"/>
        <text x="14" y="198" fill="#FDBA74">$ 389.000</text>
      </g>

