        <rect x="14" y="14" width="140" height="96" rx="10" fill="#273449"/>
        <circle cx="84" cy="62" r="30" fill="none" stroke="#F97316" stroke-width="8"/>
        <rect x="14" y="126" width="110" height="12" rx="6" fill="#64748B"/>
        <rect x="14" y="146" width="80" height="12" rx="6" fill="#475569"/>
        <text x="14" y="198" fill="#FDBA74">$ 119.900</text>
      </g>
      <g transform="translate(216 196)">
        <rect width="168" height="220" rx="14" fill="#1E293B" stroke="#334155"/>
        <rect x="14" y="14" width="140" height="96" rx="10" fill="#273449"/>
        <rect x="56" y="34" width="56" height="58" rx="8" fill="none" stroke="#F97316" stroke-width="8"/>
        <rect x="14" y="126" width="120" height="12" rx="6" fill="#64748B"/>
        <rect x="14" y="146" width="70" height="12" rx="6" fill="#475569"/>
        <text x="14" y="198" fill="#FDBA74">$ 32.900</text>
